name: NovaPay CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r application/requirements.txt

      - name: Run Unit Tests
        run: |
          python -m pytest -v

      - name: Build Docker Image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t novapay-payment-api:${{ github.sha }} \
            .

      - name: Verify Docker Image
        run: |
          docker image inspect novapay-payment-api:${{ github.sha }}