apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novapay-payment-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/nrohithr417-oss/devops-cloud-engineer-zero-downtime-cicd-pipeline.git
    targetRevision: main
    path: kubernetes/base

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true