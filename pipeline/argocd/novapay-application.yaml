apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novapay
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/nrohithr417-oss/devops-cloud-engineer-zero-downtime-cicd-pipeline.git
    targetRevision: main
    path: pipeline/helm

    helm:
      releaseName: novapay
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: novapay

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - PruneLast=true

  revisionHistoryLimit: 10